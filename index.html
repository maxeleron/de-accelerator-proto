<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMPULS</title>
  <script src="js/storage.js"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <button type="button" id="btn-theme" aria-label="Світла тема">
    <svg id="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M16 3.5A8.5 8.5 0 1 0 20.5 16 7 7 0 0 1 16 3.5z"></path>
    </svg>
    <svg id="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 3v2M12 19v2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M3 12h2M19 12h2M5.2 18.8l1.4-1.4M17.4 6.6l1.4-1.4"></path>
    </svg>
  </button>
  <main id="screen-menu">
    <header>
      <h1>IMPULS</h1>
      <p>de-accelerator-proto</p>
    </header>

    <section class="block" aria-labelledby="label-round">
      <h2 id="label-round">Раунд</h2>
      <button type="button" id="btn-start">Почати раунд</button>
      <button type="button" id="btn-base">База знань</button>
    </section>

    <section class="block" aria-labelledby="label-pack">
      <h2 id="label-pack">Пакет</h2>
      <div class="rows">
        <button type="button" data-pack="p1" aria-pressed="true">P1 Sein / haben</button>
        <button type="button" data-pack="p2" aria-pressed="false">P2 Особові закінчення</button>
        <button type="button" data-pack="p3" aria-pressed="false">P3 Артикль</button>
        <button type="button" data-pack="p4" aria-pressed="false">P4 Akkusativ</button>
      </div>
    </section>

    <section class="block" aria-labelledby="label-window">
      <h2 id="label-window">Часові межі (мс)</h2>
      <div class="rows">
        <button type="button" id="win-soft" aria-pressed="false">М’яко 1600</button>
        <button type="button" id="win-even" aria-pressed="true">Рівно 1200</button>
        <button type="button" id="win-hard" aria-pressed="false">Жорстко 900</button>
        <button type="button" id="win-free" aria-pressed="false">Без вікна</button>
      </div>
    </section>

    <p id="menu-status">Раунд ще не зібраний</p>
  </main>

  <section id="screen-round" class="is-hidden" tabindex="-1">
    <div class="round-meta">
      <p id="counter">1/14</p>
      <p id="repair-badge" class="is-hidden">Промахи</p>
    </div>
    <div class="stimulus-block">
      <p id="stimulus"></p>
      <p id="gloss"></p>
    </div>
    <div id="timer" aria-hidden="true"></div>
    <div class="options">
      <button type="button" id="opt-1"></button>
      <button type="button" id="opt-2"></button>
      <button type="button" id="opt-3"></button>
      <button type="button" id="opt-4"></button>
    </div>
  </section>

  <section id="screen-base" class="is-hidden" tabindex="-1">
    <button type="button" id="btn-base-back">До меню</button>
    <h2 id="label-base">База знань</h2>
    <div class="base-layout">
      <nav id="base-nav" aria-labelledby="label-base"></nav>
      <div id="base-body"></div>
    </div>
  </section>

  <script src="js/cards.js" defer></script>
  <script src="js/handbook.js" defer></script>
  <script src="js/state.js" defer></script>
  <script src="js/queue.js" defer></script>
  <script src="js/input.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
